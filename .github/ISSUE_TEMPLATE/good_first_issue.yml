name: Good first issue
description: Small, well-scoped task suitable for a first contribution
labels: [good first issue]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs to be done, and where.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Done when
      description: Tests, README row, etc.
    validations:
      required: true
  - type: input
    id: mentor
    attributes:
      label: Mentor
      description: Who to ping for questions (optional)
